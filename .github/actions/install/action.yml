name: Install
description: Installs dependencies and builds the project

inputs:
  os:
    description: The operating system to install dependencies for
    required: true
    default: "ubuntu-24.04"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version: 1.25.10
        cache: true

    - name: Install Xcode
      if: ${{ inputs.os == 'macos-15' }}
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Install Task
      uses: go-task/setup-task@v2
      with:
        version: 3.x

    - name: Install Dependencies
      run: task install
      shell: bash

    - name: build frontends
      shell: bash
      run: |
        go generate ./wails-frontend
        go generate ./web-frontend
